# CrowPanel 4.2" e-paper, v1.0 board revision (SSD1683 controller).
#
# The SSD1683 supports partial refresh, so full_update_every controls how often
# a full refresh runs to clear the ghosting that partial updates leave behind.
#
# On a v1.2 board use model: "4.20in-v1.2" instead - see the README for how to
# tell the two revisions apart.

esphome:
  name: crowpanel_epaper
  friendly_name: "CrowPanel E-Paper 4.2\""
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: epd_power
        - delay: 500ms

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2@main

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# GPIO 7 powers the display - must be on before anything works
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "4.20in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    full_update_every: 10
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays: epd
  buffer_size: 25%
  color_depth: 16
  on_draw_end:
    component.update: epd
  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      widgets:
        - label:
            align: CENTER
            text: "Hello, E-Paper!"
            text_color: 0x000000
            text_font: MONTSERRAT_48
