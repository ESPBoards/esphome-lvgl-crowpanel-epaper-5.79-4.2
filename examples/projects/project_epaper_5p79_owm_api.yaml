# =====================================================================
# Intervals: weather fetch + UI update
# =====================================================================
# --- Script to fetch weather (reusable) ---
script:
  - id: fetch_weather
    then:
      - http_request.get:
          url: !lambda |-
            return "http://api.openweathermap.org/data/2.5/weather?lat=" + std::string("${owm_lat}") + "&lon=" + std::string("${owm_lon}") + "&appid=" + std::string("${owm_api_key}") + "&units=metric";
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      id(cur_temp) = root["main"]["temp"].as<float>();
                      id(cur_humidity) = root["main"]["humidity"].as<int>();
                      id(cur_wind) = root["wind"]["speed"].as<float>() * 3.6f;
                      id(cur_code) = root["weather"][0]["id"].as<int>();
                      std::string ico = root["weather"][0]["icon"].as<std::string>();
                      id(cur_is_night) = (ico.find('n') != std::string::npos);
                      id(weather_valid) = true;
                      auto t = id(sntp_time).now();
                      if (t.is_valid()) { id(last_update_hour) = t.hour; id(last_update_min) = t.minute; }
                      ESP_LOGI("owm", "Current: %.1fC code=%d hum=%d wind=%.0f",
                               id(cur_temp), id(cur_code), id(cur_humidity), id(cur_wind));
                      return true;
                    });
                  } else {
                    ESP_LOGW("owm", "Current weather HTTP %d", response->status_code);
                  }
      - delay: 2s
      - http_request.get:
          url: !lambda |-
            return "http://api.openweathermap.org/data/2.5/forecast?lat=" + std::string("${owm_lat}") + "&lon=" + std::string("${owm_lon}") + "&appid=" + std::string("${owm_api_key}") + "&units=metric&cnt=6";
          capture_response: true
          max_response_buffer_size: 8192
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    json::parse_json(body, [](JsonObject root) -> bool {
                      auto list = root["list"];
                      for (int i = 0; i < 6; i++) {
                        id(fc_temps)[i] = list[i]["main"]["temp"].as<float>();
                        id(fc_codes)[i] = list[i]["weather"][0]["id"].as<int>();
                        id(fc_pops)[i] = (int)(list[i]["pop"].as<float>() * 100.0f);
                        time_t ts = list[i]["dt"].as<long>();
                        struct tm *tm_info = localtime(&ts);
                        id(fc_hours)[i] = tm_info->tm_hour;
                      }
                      ESP_LOGI("owm", "Forecast loaded: +3h=%.0f +6h=%.0f +9h=%.0f",
                               id(fc_temps)[0], id(fc_temps)[1], id(fc_temps)[2]);
                      return true;
                    });
                  } else {
                    ESP_LOGW("owm", "Forecast HTTP %d", response->status_code);
                  }

interval:
  # ---- Fetch weather every 2 min (debug, change to 10min for prod) ----
  - interval: 2min
    then:
      - script.execute: fetch_weather

  # ---- Update LVGL every 10s ----
  - interval: 10s
    then:
      - lvgl.label.update:
          id: lbl_topbar_time
          text: !lambda |-
            auto t = id(sntp_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[16];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_clock_big
          text: !lambda |-
            auto t = id(sntp_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%02d:%02d", t.hour, t.minute);
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_cur_icon
          text: !lambda |-
            int c = id(cur_code);
            bool night = id(cur_is_night);
            if (c >= 200 && c < 300) return std::string("\U000F0593");
            if (c >= 300 && c < 400) return std::string("\U000F0597");
            if (c >= 500 && c < 520) return std::string("\U000F0597");
            if (c >= 520 && c < 600) return std::string("\U000F0596");
            if (c >= 600 && c < 700) return std::string("\U000F0598");
            if (c >= 700 && c < 800) return std::string("\U000F0591");
            if (c == 800) return night ? std::string("\U000F0594") : std::string("\U000F0599");
            if (c == 801 || c == 802) return std::string("\U000F0595");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_cur_temp
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--°");
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f°", id(cur_temp));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_cur_detail
          text: !lambda |-
            if (!id(weather_valid)) return std::string("-- km/h  --%");
            char buf[32];
            snprintf(buf, sizeof(buf), "%.0f km/h  %d%%", id(cur_wind), id(cur_humidity));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_last_update
          text: !lambda |-
            if (id(last_update_hour) < 0) return std::string("");
            char buf[16];
            snprintf(buf, sizeof(buf), "updated %02d:%02d", id(last_update_hour), id(last_update_min));
            return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_time_0
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--:--");
            char buf[8]; snprintf(buf, sizeof(buf), "%02d:00", id(fc_hours)[0]); return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_icon_0
          text: !lambda |-
            int c = id(fc_codes)[0];
            if (c >= 200 && c < 300) return std::string("\U000F0593");
            if (c >= 300 && c < 400) return std::string("\U000F0597");
            if (c >= 500 && c < 520) return std::string("\U000F0597");
            if (c >= 520 && c < 600) return std::string("\U000F0596");
            if (c >= 600 && c < 700) return std::string("\U000F0598");
            if (c >= 700 && c < 800) return std::string("\U000F0591");
            if (c == 800) return std::string("\U000F0599");
            if (c == 801 || c == 802) return std::string("\U000F0595");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_fc_temp_0
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--°");
            char buf[8]; snprintf(buf, sizeof(buf), "%.0f°", id(fc_temps)[0]); return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_pop_0
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--%");
            char buf[8]; snprintf(buf, sizeof(buf), "%d%%", id(fc_pops)[0]); return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_time_1
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--:--");
            char buf[8]; snprintf(buf, sizeof(buf), "%02d:00", id(fc_hours)[1]); return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_icon_1
          text: !lambda |-
            int c = id(fc_codes)[1];
            if (c >= 200 && c < 300) return std::string("\U000F0593");
            if (c >= 300 && c < 400) return std::string("\U000F0597");
            if (c >= 500 && c < 520) return std::string("\U000F0597");
            if (c >= 520 && c < 600) return std::string("\U000F0596");
            if (c >= 600 && c < 700) return std::string("\U000F0598");
            if (c >= 700 && c < 800) return std::string("\U000F0591");
            if (c == 800) return std::string("\U000F0599");
            if (c == 801 || c == 802) return std::string("\U000F0595");
            return std::string("\U000F0590");
      - lvgl.label.update:
          id: lbl_fc_temp_1
          text: !lambda |-
            if (!id(weather_valid)) return std::string("--°");
            char buf[8]; snprintf(buf, sizeof(buf), "%.0f°", id(fc_temps)[1]); return std::string(buf);
      - lvgl.label.update:
          id: lbl_fc_pop_1
