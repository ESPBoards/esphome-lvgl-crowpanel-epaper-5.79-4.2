# This example demonstrates how to use custom components
# and LVGL to build a full weather dashboard with OpenWeatherMap
# on the CrowPanel 5.79" E-Paper display.

substitutions:
  owm_api_key: !secret owm_api_key
  owm_lat: !secret owm_lat
  owm_lon: !secret owm_lon

esphome:
  name: crowpanel_epaper
  friendly_name: "CrowPanel 5.79 E-Paper"
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: epd_power
        - delay: 500ms
    # Fetch weather after WiFi is connected
    - priority: -10
      then:
        - delay: 5s
        - script.execute: fetch_weather

external_components:
  - source: ../../components

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "CrowPanel Fallback"
    password: "crowpanel123"

captive_portal:

http_request:
  id: http_client
  timeout: 10s

# --- Globals for OWM weather data ---
globals:
  - id: cur_temp
    type: float
    initial_value: "0"
  - id: cur_code
    type: int
    initial_value: "0"
  - id: cur_humidity
    type: int
    initial_value: "0"
  - id: cur_wind
    type: float
    initial_value: "0"
  - id: cur_is_night
    type: bool
    initial_value: "false"
  - id: fc_temps
    type: float[6]
    initial_value: "{0,0,0,0,0,0}"
  - id: fc_codes
    type: int[6]
    initial_value: "{0,0,0,0,0,0}"
  - id: fc_pops
    type: int[6]
    initial_value: "{0,0,0,0,0,0}"
  - id: fc_hours
    type: int[6]
    initial_value: "{0,0,0,0,0,0}"
  - id: weather_valid
    type: bool
    initial_value: "false"
  - id: last_update_hour
    type: int
    initial_value: "-1"
  - id: last_update_min
    type: int
    initial_value: "-1"

# --- Hardware ---
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    name: "E-Paper Power"
    restore_mode: ALWAYS_ON
    internal: true

binary_sensor:
  - platform: gpio
    pin:
      number: 2
      mode: INPUT_PULLUP
      inverted: true
    id: btn_menu
    name: "Menu Button"
    on_press:
      then:
        - lvgl.page.next:
    on_click:
      min_length: 1000ms
      max_length: 5000ms
      then:
        - logger.log: "Long press: full display refresh"
        - lambda: 'id(epd).force_full_update();'
        - component.update: epd
  - platform: gpio
    pin:
      number: 1
      mode: INPUT_PULLUP
      inverted: true
    id: btn_back
    name: "Back Button"
    on_press:
      then:
        - lvgl.page.previous:
  - platform: gpio
    pin:
      number: 5
      mode: INPUT_PULLUP
      inverted: true
    id: btn_confirm
    name: "Rotary Confirm"
    on_press:
      then:
        - logger.log: "Manual weather refresh"
        - script.execute: fetch_weather

sensor:
  - platform: rotary_encoder
    id: knob
    name: "Rotary Encoder"
    pin_a:
      number: 6
      mode: INPUT_PULLUP
    pin_b:
      number: 4
      mode: INPUT_PULLUP
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_rssi
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_addr

time:
  - platform: sntp
    id: sntp_time
    timezone: "Europe/Brussels"
    on_time:
      - seconds: 0
        minutes: 0
        hours: 3
        then:
          - lambda: 'id(epd).force_full_update();'
          - component.update: epd

# --- Fonts: all 1-bit for crisp e-paper ---
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 22
    bpp: 1
  - file: "gfonts://Roboto"
    id: font_body
    size: 18
    bpp: 1
  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    bpp: 1
  - file: "gfonts://Roboto@700"
    id: font_temp_big
    size: 72
    bpp: 1
    glyphs: "0123456789.-:° "
  - file: "gfonts://Roboto@700"
    id: font_temp_sm
    size: 22
    bpp: 1
    glyphs: "0123456789.-° "
  - file: "gfonts://Roboto"
    id: font_time_sm
    size: 14
    bpp: 1
    glyphs: "0123456789: "
  # Big weather icon (current conditions)
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_big
    size: 56
    bpp: 1
    glyphs:
      - "\U000F0599"  # sunny
      - "\U000F0594"  # night
      - "\U000F0590"  # cloudy
      - "\U000F0595"  # partly
      - "\U000F0596"  # pouring
      - "\U000F0597"  # rainy
      - "\U000F0598"  # snowy
      - "\U000F0591"  # fog
      - "\U000F0593"  # lightning
      - "\U000F067E"  # lightning_rain
      - "\U000F0592"  # hail
      - "\U000F059D"  # windy
      - "\U000F067F"  # snowy_rainy
  # Small weather icons (forecast timeline)
  - file:
      type: web
      url: "https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf"
    id: icon_sm
    size: 28
    bpp: 1
    glyphs:
      - "\U000F0599"  # sunny
      - "\U000F0594"  # night
      - "\U000F0590"  # cloudy
      - "\U000F0595"  # partly
      - "\U000F0596"  # pouring
      - "\U000F0597"  # rainy
      - "\U000F0598"  # snowy
      - "\U000F0591"  # fog
      - "\U000F0593"  # lightning
      - "\U000F067E"  # lightning_rain
      - "\U000F0592"  # hail
      - "\U000F059D"  # windy
      - "\U000F067F"  # snowy_rainy

# --- E-Paper display ---
display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    clk_pin: 12
    mosi_pin: 11
    rotation: 0
    full_update_every: 9999
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

# --- LVGL UI ---
lvgl:
  displays: epd
  buffer_size: 25%
  color_depth: 16

  encoders:
    - sensor: knob
      enter_button: btn_confirm
      group: ui_group

  on_draw_end:
    component.update: epd

  pages:
    # ===== PAGE 1: Weather Dashboard =====
    - id: page_weather
      bg_color: 0xFFFFFF
      scrollbar_mode: "OFF"
      widgets:
        # ---- TOP BAR ----
        - obj:
            x: 0
            y: 0
            width: 792
            height: 38
            bg_color: 0x000000
            bg_opa: COVER
            pad_left: 12
            pad_right: 12
            scrollbar_mode: "OFF"
            widgets:
              - label:
                  align: LEFT_MID
                  text_color: 0xFFFFFF
                  text_font: font_title
                  id: lbl_topbar_left
                  text: "Brussels"
              - label:
                  align: RIGHT_MID
                  text_color: 0xFFFFFF
                  text_font: font_body
                  id: lbl_topbar_time
                  text: "--:--"

        # ---- LEFT: Current weather ----
        - obj:
            x: 0
            y: 40
            width: 220
            height: 232
            bg_color: 0xFFFFFF
            bg_opa: COVER
            border_width: 0
            pad_top: 8
            scrollbar_mode: "OFF"
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              pad_row: 2
            widgets:
              - label:
                  id: lbl_cur_icon
