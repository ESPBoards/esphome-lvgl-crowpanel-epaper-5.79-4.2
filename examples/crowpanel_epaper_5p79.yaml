# CrowPanel 5.79" e-paper, minimal LVGL setup (dual SSD1683 cascade).
#
# This panel needs invert_colors: true. full_update_every is set high so LVGL
# redraws stay partial - call id(epd).force_full_update() to clear ghosting.
#
# For the 4.2" panels use model: "4.20in" or "4.20in-v1.2" - see the README for
# how to tell those two revisions apart.

esphome:
  name: crowpanel_epaper
  friendly_name: "CrowPanel E-Paper"
  on_boot:
    - priority: 600
      then:
        - switch.turn_on: epd_power
        - delay: 500ms

external_components:
  - source: github://ESPBoards/esphome-lvgl-crowpanel-epaper-5.79-4.2@main

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# GPIO 7 powers the display - must be on before anything works
switch:
  - platform: gpio
    pin: 7
    id: epd_power
    restore_mode: ALWAYS_ON
    internal: true

display:
  - platform: crowpanel_epaper
    id: epd
    model: "5.79in"
    clk_pin: 12
    mosi_pin: 11
    cs_pin: 45
    dc_pin: 46
    reset_pin: 47
    busy_pin: 48
    invert_colors: true
    full_update_every: 9999
    auto_clear_enabled: false
    update_interval: never

lvgl:
  displays: epd
  buffer_size: 25%
  color_depth: 16
  on_draw_end:
    component.update: epd
  pages:
    - id: main_page
      bg_color: 0xFFFFFF
      widgets:
        - label:
            align: CENTER
            text: "Hello, E-Paper!"
            text_color: 0x000000
            text_font: MONTSERRAT_48
